name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Crear keystore de firma
        run: |
          keytool -genkeypair -keystore app/src/main/assets/lumen.p12 -storetype PKCS12 \
            -alias lumen -keyalg RSA -keysize 2048 -validity 9999 \
            -storepass lumen123 -keypass lumen123 -dname "CN=Lumen" -noprompt

      - name: Compilar APK debug
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew :app:assembleDebug; else gradle :app:assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-apk
          path: app/build/outputs/apk/debug/*.apk
